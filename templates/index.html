<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メディア変換・サイズ変更ツール</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 24px 20px;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            color: #111;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            color: #2e7d32;
            border-bottom-color: #2e7d32;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }

        .hint {
            font-size: 11px;
            color: #d32f2f;
            margin-bottom: 10px;
            line-height: 1.4;
            font-weight: bold;
        }

        .file-btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
        }

        .file-btn:active {
            background: #1b5e20;
        }

        .file-list {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 5px;
            background: #f9f9f9;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
            color: #444;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .remove-btn {
            color: #d32f2f;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 14px;
            padding: 0 5px;
            font-weight: bold;
        }

        .divider {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin: 20px 0;
            position: relative;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: #f9f9f9;
        }

        .size-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }

        .size-inputs input {
            width: 50%;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: normal;
            margin-top: 6px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #cccccc;
            color: #666666;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: not-allowed;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .submit-btn.active {
            background: #2e7d32;
            color: white;
            cursor: pointer;
        }

        .progress-section {
            margin-top: 20px;
            display: none;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #333;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #2e7d32;
            transition: width 0.3s;
        }

        .download-list {
            margin-top: 15px;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #1976d2;
            color: white;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>メディア変換・サイズ変更<br>ツール</h1>

    <div class="tabs">
        <button class="tab-btn" onclick="switchTab('image')">🖼️ Image (画像)</button>
        <button class="tab-btn active" onclick="switchTab('video')">🎬 Video (動画・M3U8)</button>
    </div>

    <form id="convertForm" enctype="multipart/form-data">
        <!-- フォルダごと、または複数ファイルを一度に選択できるように変更 -->
        <input type="file" id="fileInput" multiple webkitdirectory style="display: none;" onchange="handleFileSelect(event)">

        <div class="form-group">
            <label id="fileLabel">M3U8と.tsが入ったフォルダを選択:</label>
            <p class="hint" id="fileHint">※スマホから行う場合、プレイリストと全TSファイルが入った「フォルダ」を丸ごと選択してください。</p>
            <button type="button" class="file-btn" onclick="document.getElementById('fileInput').click()">📁 フォルダを選ぶ</button>
            <div class="file-list" id="fileListDisplay" style="display: none;"></div>
        </div>

        <div class="divider">—— またはリンク(URL)から取得 ——</div>

        <div class="form-group">
            <label>動画やM3U8のURL (https://...):</label>
            <input type="text" id="videoUrl" placeholder="https://..." oninput="checkFormValid()">
        </div>

        <div class="form-group">
            <label>変換後のフォーマット:</label>
            <select id="targetFormat" onchange="checkFormValid()">
                <option value="MP4">MP4 (動画)</option>
                <option value="TS">TS (無劣化結合・抽出)</option>
                <option value="M3U8">M3U8 (HLSストリーミング)</option>
                <option value="WEBM">WEBM</option>
                <option value="MOV">MOV</option>
                <option value="AVI">AVI</option>
                <option value="JPEG">JPEG (画像)</option>
                <option value="PNG">PNG (画像)</option>
            </select>
        </div>

        <div class="form-group">
            <label>サイズ変更モード:</label>
            <select id="sizeMode" onchange="toggleSizeInputs()">
                <option value="none">なし (元のサイズを維持)</option>
                <option value="custom">サイズを直接指定 (px)</option>
            </select>
            <div class="size-inputs" id="sizeInputs" style="display: none;">
                <input type="number" id="width" placeholder="幅 (px)" min="1">
                <input type="number" id="height" placeholder="高さ (px)" min="1">
            </div>
            <label class="checkbox-label" id="aspectRatioLabel" style="display: none;">
                <input type="checkbox" id="maintainAspect" value="true" checked>
                縦横比を維持する
            </label>
        </div>

        <button type="button" id="submitBtn" class="submit-btn" onclick="startConversion()">変換・サイズ変更実行</button>
    </form>

    <div class="progress-section" id="progressSection">
        <div class="progress-header">
            <span id="statusMessage">リクエストを送信中...</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="download-list" id="downloadList"></div>
    </div>
</div>

<script>
    let currentTab = 'video';
    let selectedFiles = [];

    function switchTab(tab) {
        currentTab = tab;
        const buttons = document.querySelectorAll('.tab-btn');
        buttons[0].classList.toggle('active', tab === 'image');
        buttons[1].classList.toggle('active', tab === 'video');

        const targetFormat = document.getElementById('targetFormat');
        const fileHint = document.getElementById('fileHint');
        const fileInput = document.getElementById('fileInput');

        if (tab === 'image') {
            targetFormat.value = "JPEG";
            fileHint.innerText = "※JPG, PNG等の画像ファイルを複数選択してください。";
            fileInput.removeAttribute('webkitdirectory');
        } else {
            targetFormat.value = "MP4";
            fileHint.innerText = "※プレイリストと全TSファイルが入った「フォルダ」を丸ごと選択してください。";
            fileInput.setAttribute('webkitdirectory', '');
        }
        checkFormValid();
    }

    function handleFileSelect(event) {
        const files = event.target.files;
        selectedFiles = []; // リセットして一括読み込み
        for (let i = 0; i < files.length; i++) {
            selectedFiles.push(files[i]);
        }
        renderFileList();
        checkFormValid();
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileList();
        checkFormValid();
    }

    function renderFileList() {
        const display = document.getElementById('fileListDisplay');
        if (selectedFiles.length === 0) {
            display.style.display = 'none';
            display.innerHTML = '';
            return;
        }
        display.style.display = 'block';
        display.innerHTML = '';
        
        // 最初の10件＋件数を表示
        selectedFiles.slice(0, 15).forEach((file, index) => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%;">${file.name}</span>
                <button type="button" class="remove-btn" onclick="removeFile(${index})">✖</button>
            `;
            display.appendChild(div);
        });
        if (selectedFiles.length > 15) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `<span style="color:#666; font-weight:bold;">他 ${selectedFiles.length - 15} 個のファイル...</span>`;
            display.appendChild(div);
        }
    }

    function toggleSizeInputs() {
        const mode = document.getElementById('sizeMode').value;
        const isCustom = mode === 'custom';
        document.getElementById('sizeInputs').style.display = isCustom ? 'flex' : 'none';
        document.getElementById('aspectRatioLabel').style.display = isCustom ? 'flex' : 'none';
    }

    function checkFormValid() {
        const videoUrl = document.getElementById('videoUrl').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        if (selectedFiles.length > 0 || videoUrl.length > 0) {
            submitBtn.classList.add('active');
            submitBtn.disabled = false;
        } else {
            submitBtn.classList.remove('active');
            submitBtn.disabled = true;
        }
    }

    async function startConversion() {
        const formData = new FormData();
        selectedFiles.forEach(file => {
            // フォルダ選択時の相対パス構造を保持して送信
            formData.append('files', file, file.webkitRelativePath || file.name);
        });
        formData.append('target_format', document.getElementById('targetFormat').value);
        formData.append('video_url', document.getElementById('videoUrl').value);
        
        const mode = document.getElementById('sizeMode').value;
        if (mode === 'custom') {
            formData.append('width', document.getElementById('width').value);
            formData.append('height', document.getElementById('height').value);
            formData.append('maintain_aspect', document.getElementById('maintainAspect').checked);
        }

        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('downloadList').innerHTML = '';
        updateProgress(0, 'リクエストを送信中...');

        try {
            const res = await fetch('/convert/', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            if (data.error) {
                alert("エラーが発生しました:\n" + data.error);
                return;
            }

            pollProgress(data.task_id);
        } catch (err) {
            alert("通信エラーが発生しました。");
        }
    }

    async function pollProgress(taskId) {
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`/progress/${taskId}`);
                const data = await res.json();

                if (data.error) {
                    clearInterval(interval);
                    alert("処理エラー:\n" + data.error);
                    return;
                }

                updateProgress(data.progress, data.message);

                if (data.status === 'completed') {
                    clearInterval(interval);
                    showDownloads(taskId, data.files);
                } else if (data.status === 'error') {
                    clearInterval(interval);
                    const errText = data.errors ? data.errors.join("\n") : data.message;
                    alert("エラーが発生しました:\n" + errText);
                }
            } catch (e) {
                clearInterval(interval);
                alert("進捗の取得に失敗しました。");
            }
        }, 1000);
    }

    // (Python側で既にwebkitRelativePathの階層構造を活かせるようにFlask側が受け取る準備はできています)

    function updateProgress(percent, message) {
        document.getElementById('progressBarFill').style.width = `${percent}%`;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('statusMessage').innerText = message;
    }

    function showDownloads(taskId, files) {
        const listContainer = document.getElementById('downloadList');
        listContainer.innerHTML = '';

        files.forEach(filename => {
            const btn = document.createElement('a');
            btn.className = 'download-btn';
            btn.href = `/download/${taskId}/${encodeURIComponent(filename)}`;
            btn.innerText = `⬇️ ${filename} をダウンロード`;
            listContainer.appendChild(btn);
        });
    }

    checkFormValid();
</script>
</body>
</html>
