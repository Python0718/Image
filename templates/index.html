<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メディア変換・サイズ変更ツール</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 24px 20px;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            color: #111;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            color: #2e7d32;
            border-bottom-color: #2e7d32;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }

        .file-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-btn {
            background: #e0e0e0;
            border: 1px solid #ccc;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            color: #333;
        }

        .file-name {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        .divider {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin: 15px 0;
            position: relative;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: #f9f9f9;
        }

        .size-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }

        .size-inputs input {
            width: 50%;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: normal;
            margin-top: 6px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #cccccc;
            color: #666666;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: not-allowed;
            transition: background 0.2s;
        }

        .submit-btn.active {
            background: #2e7d32;
            color: white;
            cursor: pointer;
        }

        .progress-section {
            margin-top: 20px;
            display: none;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #333;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #2e7d32;
            transition: width 0.3s;
        }

        .download-list {
            margin-top: 15px;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #1976d2;
            color: white;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>メディア変換・サイズ変更<br>ツール</h1>

    <div class="tabs">
        <button class="tab-btn" onclick="switchTab('image')">🖼️ Image (画像)</button>
        <button class="tab-btn active" onclick="switchTab('video')">🎬 Video (動画・M3U8)</button>
    </div>

    <form id="convertForm" enctype="multipart/form-data">
        <input type="file" id="fileInput" name="files" multiple style="display: none;" onchange="updateFileName()">

        <div class="form-group">
            <label id="fileLabel">ローカルの動画・プレイリストファイルを選択 (MP4, M3U8, TS, ZIP等):</label>
            <div class="file-input-wrapper">
                <button type="button" class="file-btn" onclick="document.getElementById('fileInput').click()">ファイルを選択</button>
                <span class="file-name" id="fileNameDisplay">ファイル未選択</span>
            </div>
        </div>

        <div class="divider">—— またはリンク(URL)から取得 ——</div>

        <div class="form-group">
            <label>動画やM3U8のURL (https://...):</label>
            <input type="text" id="videoUrl" name="video_url" placeholder="https://..." oninput="checkFormValid()">
        </div>

        <div class="form-group">
            <label>変換後のフォーマット:</label>
            <select id="targetFormat" name="target_format" onchange="checkFormValid()">
                <option value="MP4">MP4 (動画)</option>
                <option value="TS">TS (無劣化結合・抽出)</option>
                <option value="M3U8">M3U8 (HLSストリーミング)</option>
                <option value="WEBM">WEBM</option>
                <option value="MOV">MOV</option>
                <option value="AVI">AVI</option>
                <option value="JPEG">JPEG (画像)</option>
                <option value="PNG">PNG (画像)</option>
            </select>
        </div>

        <div class="form-group">
            <label>サイズ変更モード:</label>
            <select id="sizeMode" onchange="toggleSizeInputs()">
                <option value="none">なし (元のサイズを維持)</option>
                <option value="custom">サイズを直接指定 (px)</option>
            </select>
            <div class="size-inputs" id="sizeInputs" style="display: none;">
                <input type="number" id="width" name="width" placeholder="幅 (px)" min="1">
                <input type="number" id="height" name="height" placeholder="高さ (px)" min="1">
            </div>
            <label class="checkbox-label" id="aspectRatioLabel" style="display: none;">
                <input type="checkbox" id="maintainAspect" name="maintain_aspect" value="true" checked>
                縦横比を維持する
            </label>
        </div>

        <button type="button" id="submitBtn" class="submit-btn" onclick="startConversion()">変換・サイズ変更実行</button>
    </form>

    <div class="progress-section" id="progressSection">
        <div class="progress-header">
            <span id="statusMessage">リクエストを送信中...</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="download-list" id="downloadList"></div>
    </div>
</div>

<script>
    let currentTab = 'video';

    function switchTab(tab) {
        currentTab = tab;
        const buttons = document.querySelectorAll('.tab-btn');
        buttons[0].classList.toggle('active', tab === 'image');
        buttons[1].classList.toggle('active', tab === 'video');

        const fileLabel = document.getElementById('fileLabel');
        const targetFormat = document.getElementById('targetFormat');

        if (tab === 'image') {
            fileLabel.innerText = "ローカルの画像ファイルを選択 (JPG, PNG, WEBP, HEIC等):";
            targetFormat.value = "JPEG";
        } else {
            fileLabel.innerText = "ローカルの動画・プレイリストファイルを選択 (MP4, M3U8, TS, ZIP等):";
            targetFormat.value = "MP4";
        }
        checkFormValid();
    }

    function updateFileName() {
        const input = document.getElementById('fileInput');
        const display = document.getElementById('fileNameDisplay');
        if (input.files.length === 0) {
            display.innerText = "ファイル未選択";
        } else if (input.files.length === 1) {
            display.innerText = input.files[0].name;
        } else {
            display.innerText = `${input.files.length} 個のファイルを選択中`;
        }
        checkFormValid();
    }

    function toggleSizeInputs() {
        const mode = document.getElementById('sizeMode').value;
        const isCustom = mode === 'custom';
        document.getElementById('sizeInputs').style.display = isCustom ? 'flex' : 'none';
        document.getElementById('aspectRatioLabel').style.display = isCustom ? 'flex' : 'none';
    }

    function checkFormValid() {
        const fileInput = document.getElementById('fileInput');
        const videoUrl = document.getElementById('videoUrl').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        if (fileInput.files.length > 0 || videoUrl.length > 0) {
            submitBtn.classList.add('active');
            submitBtn.disabled = false;
        } else {
            submitBtn.classList.remove('active');
            submitBtn.disabled = true;
        }
    }

    async function startConversion() {
        const form = document.getElementById('convertForm');
        const formData = new FormData(form);

        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('downloadList').innerHTML = '';
        updateProgress(0, 'リクエストを送信中...');

        try {
            const res = await fetch('/convert/', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            if (data.error) {
                alert("エラーが発生しました:\n" + data.error);
                return;
            }

            pollProgress(data.task_id);
        } catch (err) {
            alert("通信エラーが発生しました。");
        }
    }

    async function pollProgress(taskId) {
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`/progress/${taskId}`);
                const data = await res.json();

                if (data.error) {
                    clearInterval(interval);
                    alert("処理エラー:\n" + data.error);
                    return;
                }

                updateProgress(data.progress, data.message);

                if (data.status === 'completed') {
                    clearInterval(interval);
                    showDownloads(taskId, data.files);
                } else if (data.status === 'error') {
                    clearInterval(interval);
                    const errText = data.errors ? data.errors.join("\n") : data.message;
                    alert("エラーが発生しました:\n" + errText);
                }
            } catch (e) {
                clearInterval(interval);
                alert("進捗の取得に失敗しました。");
            }
        }, 1000);
    }

    function updateProgress(percent, message) {
        document.getElementById('progressBarFill').style.width = `${percent}%`;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('statusMessage').innerText = message;
    }

    function showDownloads(taskId, files) {
        const listContainer = document.getElementById('downloadList');
        listContainer.innerHTML = '';

        files.forEach(filename => {
            const btn = document.createElement('a');
            btn.className = 'download-btn';
            btn.href = `/download/${taskId}/${encodeURIComponent(filename)}`;
            btn.innerText = `⬇️ ${filename} をダウンロード`;
            listContainer.appendChild(btn);
        });
    }

    // 初期化チェック
    checkFormValid();
</script>
</body>
</html>
