<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>画像形式変換ツール</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; background: #f9f9f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin: 20px 0; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 10px; box-sizing: border-box; }
        select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #4CAF50; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="card">
        <h2>画像形式変換ツール (Render用)</h2>
        <form action="/convert/" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>画像ファイルを選択 (複数選択可):</label>
                <!-- SVGやICOも選択できるように拡張 -->
                <input type="file" name="files" multiple required accept="image/*,.svg,.ico">
            </div>
            <div class="form-group">
                <label>変換後の形式:</label>
                <select name="target_format">
                    <option value="JPEG">JPEG</option>
                    <option value="PNG">PNG</option>
                    <option value="WEBP">WEBP</option>
                    <option value="ICO">ICO</option>
                </select>
            </div>
            <button type="submit">一括変換してZIPでダウンロード</button>
        </form>
    </div>
</body>
</html>
