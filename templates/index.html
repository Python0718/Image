<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像形式・サイズ変換ツール</title>
    <style>
        body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; text-align: center; background: #f9f9f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin: 20px 0; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"], select { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        input[type="file"] { width: 100%; padding: 10px; box-sizing: border-box; }
        
        .size-box { background: #f0f4f8; padding: 15px; border-radius: 6px; margin-top: 10px; display: none; }
        .input-row { display: flex; gap: 10px; margin-top: 10px; }
        .input-row > div { flex: 1; }
        .input-row label { font-size: 13px; color: #555; }
        
        button { background: #4CAF50; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; }
        button:hover { background: #45a049; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        .result-list { margin-top: 20px; text-align: left; border-top: 1px solid #eee; padding-top: 15px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #f1f1f1; padding: 10px 14px; border-radius: 4px; }
        .download-btn { background: #008CBA; color: white; padding: 6px 14px; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .download-btn:hover { background: #007399; }
        .loading { display: none; margin-top: 15px; color: #666; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>画像形式・サイズ変換ツール</h2>
        <form id="convertForm">
            <div class="form-group">
                <label>画像ファイルを選択 (RAW, HEIC, SVG, GIF等に対応):</label>
                <input type="file" name="files" multiple required accept="image/*,.heic,.heif,.avif,.svg,.ico,.dng,.cr2,.cr3,.nef,.arw">
            </div>

            <div class="form-group">
                <label>変換後の形式:</label>
                <select name="target_format">
                    <option value="JPEG">JPEG (.jpg)</option>
                    <option value="PNG">PNG (.png)</option>
                    <option value="WEBP">WEBP (.webp)</option>
                    <option value="GIF">GIF (.gif)</option>
                    <option value="AVIF">AVIF (.avif)</option>
                    <option value="HEIC">HEIC (.heic)</option>
                    <option value="ICO">ICO (.ico)</option>
                    <option value="SVG">SVG (.svg)</option>
                </select>
            </div>

            <div class="form-group">
                <label>サイズ変更モード:</label>
                <select id="sizeMode">
                    <option value="none">なし（元のサイズを維持）</option>
                    <option value="aspect">アスペクト比で指定</option>
                    <option value="manual">手入力（自由指定）</option>
                </select>

                <!-- アスペクト比指定モードの設定エリア -->
                <div id="aspectArea" class="size-box">
                    <label>アスペクト比（横 : 縦）:</label>
                    <select id="aspectRatio">
                        <option value="16:9">16 : 9 (横長 - YouTube/PC)</option>
                        <option value="4:3">4 : 3 (標準 - デジカメ)</option>
                        <option value="1:1">1 : 1 (正方形 - Instagram等)</option>
                        <option value="9:16">9 : 16 (縦長 - スマホ/リール)</option>
                        <option value="3:4">3 : 4 (縦長標準)</option>
                    </select>
                    
                    <div class="input-row">
                        <div>
                            <label>指定する横幅 (px):</label>
                            <input type="number" id="aspectWidth" min="1" placeholder="例: 1920">
                        </div>
                        <div>
                            <label>自動計算された高さ (px):</label>
                            <input type="number" id="aspectHeight" readonly style="background: #e9e9e9; cursor: not-allowed;" placeholder="自動計算">
                        </div>
                    </div>
                </div>

                <!-- 手入力モードの設定エリア -->
                <div id="manualArea" class="size-box">
                    <div class="input-row">
                        <div>
                            <label>横幅 (px):</label>
                            <input type="number" id="manualWidth" min="1" placeholder="例: 1200">
                        </div>
                        <div>
                            <label>高さ (px):</label>
                            <input type="number" id="manualHeight" min="1" placeholder="例: 800">
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn">変換・サイズ変更実行</button>
        </form>

        <div id="loading" class="loading">⏳ 処理中... しばらくお待ちください</div>

        <div id="resultContainer" class="result-list" style="display: none;">
            <h3>変換完了ファイル</h3>
            <div id="fileList"></div>
        </div>
    </div>

    <script>
        const sizeMode = document.getElementById('sizeMode');
        const aspectArea = document.getElementById('aspectArea');
        const manualArea = document.getElementById('manualArea');
        const aspectRatio = document.getElementById('aspectRatio');
        const aspectWidth = document.getElementById('aspectWidth');
        const aspectHeight = document.getElementById('aspectHeight');

        // モード切替イベント
        sizeMode.addEventListener('change', () => {
            aspectArea.style.display = 'none';
            manualArea.style.display = 'none';

            if (sizeMode.value === 'aspect') {
                aspectArea.style.display = 'block';
            } else if (sizeMode.value === 'manual') {
                manualArea.style.display = 'block';
            }
        });

        // アスペクト比から高さを自動計算する関数
        function calculateHeight() {
            const widthVal = parseFloat(aspectWidth.value);
            if (!widthVal || widthVal <= 0) {
                aspectHeight.value = '';
                return;
            }

            const [ratioW, ratioH] = aspectRatio.value.split(':').map(Number);
            const calculatedH = Math.round((widthVal * ratioH) / ratioW);
            aspectHeight.value = calculatedH;
        }

        aspectWidth.addEventListener('input', calculateHeight);
        aspectRatio.addEventListener('change', calculateHeight);

        // フォーム送信処理
        document.getElementById('convertForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const fileList = document.getElementById('fileList');

            const formData = new FormData(e.target);

            // モードに応じた width / height パラメータの設定
            const mode = sizeMode.value;
            if (mode === 'aspect') {
                if (aspectWidth.value) formData.set('width', aspectWidth.value);
                if (aspectHeight.value) formData.set('height', aspectHeight.value);
                formData.set('maintain_aspect', 'false'); // アスペクト比に合わせて計算済みのため強制サイズ指定
            } else if (mode === 'manual') {
                const manualW = document.getElementById('manualWidth').value;
                const manualH = document.getElementById('manualHeight').value;
                if (manualW) formData.set('width', manualW);
                if (manualH) formData.set('height', manualH);
                formData.set('maintain_aspect', 'false');
            } else {
                // なし（元のサイズを維持）
                formData.delete('width');
                formData.delete('height');
                formData.set('maintain_aspect', 'true');
            }

            submitBtn.disabled = true;
            loading.style.display = 'block';
            resultContainer.style.display = 'none';
            fileList.innerHTML = '';

            try {
                const response = await fetch('/convert/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('変換処理に失敗しました');
                }

                const data = await response.json();
                
                data.files.forEach(filename => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <span>${filename}</span>
                        <a class="download-btn" href="/download/${data.session_id}/${filename}">ダウンロード</a>
                    `;
                    fileList.appendChild(item);
                });

                resultContainer.style.display = 'block';
            } catch (err) {
                alert('エラーが発生しました: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
